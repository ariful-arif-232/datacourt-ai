name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: datacourt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/datacourt_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[ml,dev]"
      - name: Lint
        run: ruff check datacourt tests
      - name: Format
        run: ruff format --check datacourt tests
      - name: Type check (core modules)
        run: mypy
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/datacourt_test
        run: alembic upgrade head && alembic downgrade base
      - name: Tests (unit, API, S3 storage on moto, GitHub Actions dispatch and workers end to end)
        run: pytest -p no:logging

  api-core:
    name: API with core dependencies only (as deployed on Vercel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install .
      - name: Starts without the ML stack
        run: |
          python - <<'PY'
          import sys
          from fastapi.testclient import TestClient
          from datacourt.main import create_app
          app = create_app()
          heavy = [m for m in ("cv2", "sklearn", "scipy", "PIL", "faiss", "torch") if m in sys.modules]
          assert not heavy, f"API imports the ML stack: {heavy}"
          assert TestClient(app).get("/api/v1/openapi.json").status_code == 200
          PY
      - name: Explains missing production settings instead of crashing
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql://user:pass@db.example.com/app
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from datacourt.main import app
          r = TestClient(app).get("/api/v1/health")
          assert r.status_code == 503 and r.json()["configured"] is False, r.text
          assert any("AUTH_SECRET" in p for p in r.json()["problems"])
          PY

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Docs copies are in sync with docs/
        run: node scripts/sync-docs.mjs --check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
