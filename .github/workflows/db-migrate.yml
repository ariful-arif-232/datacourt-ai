name: Database migrations

# Applies Alembic migrations to the production database (Neon) when they change on the deployed
# branch, or on demand. Migrations take a transaction-scoped advisory lock, so this and worker
# runs (which also migrate before draining) never apply them concurrently.

on:
  push:
    branches: [main]
    paths:
      - services/api/datacourt/migrations/**
      - services/api/datacourt/db/models.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: services/api
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping migrations."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - if: env.SKIP != '1'
        run: pip install --disable-pip-version-check .
      - name: alembic upgrade head
        if: env.SKIP != '1'
        run: |
          alembic upgrade head
          echo "Database schema at revision: $(alembic current 2>/dev/null | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
