name: Ingestion check

# The real ingestion and a FAST audit on a GitHub-hosted runner, installed exactly like the
# DataCourt worker (core, then the `ml` extra), against a throwaway PostgreSQL service and local
# storage: no secrets and no production data. The dataset mixes generated JPEG and HEIC photos
# (encoded by libheif) with the public HEIC/HEIF test corpus of pillow-heif (iPhone, Apple Vision
# Pro, Samsung, Xiaomi and Sony files, plus corrupt and oversized ones). The run checks decoding,
# upright orientation, byte-identical originals, the unchanged archive, thumbnails, browser copies
# and duplicates across formats (see datacourt/ingest_check.py).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ingest_check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/ingest_check
      STORAGE_BACKEND: local
      LOCAL_STORAGE_ROOT: /tmp/datacourt-ingest-check-objects
      EXECUTION_BACKEND: none
      DATACOURT_ROLE: worker
      PUBLIC_LOGS: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: services/api

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install DataCourt like the worker (core, then the ML stack)
        run: |
          pip install --disable-pip-version-check .
          pip install --disable-pip-version-check ".[ml]"
          python -c "import pillow_heif as h; print('pillow-heif', h.__version__, '| libheif', h.libheif_version())"

      - name: Real-world HEIC/HEIF files (pillow-heif's public test corpus)
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/bigcat88/pillow_heif "$RUNNER_TEMP/pillow_heif"
          git -C "$RUNNER_TEMP/pillow_heif" sparse-checkout set \
            tests/images/heif_other tests/images/heif_special tests/images/heif_corrupted
          git -C "$RUNNER_TEMP/pillow_heif" log -1 --format='corpus commit %h (%cs)'

      - name: Create the scratch database schema
        run: alembic upgrade head

      - name: Ingest and audit
        run: datacourt-ingest-check --real-dir "$RUNNER_TEMP/pillow_heif/tests/images"
