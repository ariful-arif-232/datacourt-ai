name: Object storage check

# Verifies the production bucket (Backblaze B2) end to end with the repository secrets: object
# write/read, ranged reads, listing, presigned single and multipart uploads, presigned downloads,
# artifact round-trips, versioned deletes and, with an origin, the CORS rule browser uploads need.
# Test objects live under datacourt-storage-check/ and are purged afterwards. Output names checks
# and outcomes only.

on:
  workflow_dispatch:
    inputs:
      origin:
        description: App origin browsers upload from (checks the bucket's CORS rules)
        type: string
        default: https://datacourt-ai.vercel.app

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    env:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      ORIGIN: ${{ inputs.origin }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: services/api
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install --disable-pip-version-check .
      - name: Run the storage check
        run: |
          case "$ORIGIN" in ''|https://*) ;; *) echo "::error::origin must start with https://"; exit 1;; esac
          datacourt-storage-check ${ORIGIN:+--origin "$ORIGIN"}
